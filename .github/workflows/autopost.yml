name: AutoPost Hits MP

on:
  workflow_dispatch:
  schedule:
    # Резервный будильник раз в 6 часов на случай сбоя сети
    - cron: '15 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hits-mp-autopost-loop
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot loop (5.5 hours)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PARTNER_SEARCH_TEMPLATE: ${{ secrets.PARTNER_SEARCH_TEMPLATE }}
          POST_INTERVAL_MINUTES: "180"
        run: |
          python bot.py

      - name: Trigger next 5.5h cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autopost.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
            
