name: AutoPost Hits MP

on:
  schedule:
    # Запуск каждые 3 часа с 06:00 до 21:00 по UTC (09:00 - 00:00 по МСК)
    - cron: '0 6,9,12,15,18,21 * * *'
  workflow_dispatch: # Кнопка ручного запуска для проверки

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DONOR_CHANNELS: ${{ secrets.DONOR_CHANNELS }}
          PARTNER_SEARCH_TEMPLATE: ${{ secrets.PARTNER_SEARCH_TEMPLATE }}
        run: |
          python bot.py

      - name: Commit updated history.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update post history" && git push)
          
